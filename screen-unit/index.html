<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<title>
 وحدة الفحص المتنوع - نيابة الشئون الاقتصادية وغسل الأموال بالاسكندرية
</title>

<meta charset="UTF-8">

<meta
  name="description"
  content="خدمات الاستعلام عن الفحص والأوراق المطلوبة الخاصة بوحدة الفحص المتنوع بالإسكندرية"

<meta
  name="keywords"
  content="وحدة الفحص المتنوع, الاستعلام عن الفحص, نيابة الشئون الاقتصادية, غسل الأموال"
/>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  justify-content: center;
  align-items: flex-end; /* آخر الشاشة */
  background-image: url('./images/background2.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

#main {
  display: flex;
  justify-content: space-around; /* المسافات متساوية */
  width: 150%;                     /* عرض الحاوية */
  padding-bottom: 200px;
}


 .logo-link {
  display: block;        /* يخلي اللينك ياخد مساحة */
  width: 45%;
  text-decoration: none;
/* background:#e67e00; */
 /*  background-color: #f28c1a;*/
   border-radius: 50%;
     animation: pulse 2s infinite; /* 👈 النبض */

 }
  @keyframes pulse {
  0% {
    transform: scale(1);
    box-shadow: 0 0 0 0 rgba(255,255,255,0.4);
  }
  50% {
    transform: scale(1.05);
    box-shadow: 0 0 15px 5px rgba(255,255,255,0.2);
  }
  100% {
    transform: scale(1);
    box-shadow: 0 0 0 0 rgba(255,255,255,0);
  }
}
.line2 {
  font-size:25px;
}
  
  .text-box {
   /* background: rgba(0,0,0,0.6); */
    background:#b6957a ;
    font-size :30px;
    font-weight: 600; /* متوسط */

    color: black ;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
  backdrop-filter: blur(6px);
  cursor: pointer;
  transition: none; /* يمنع أي حركة */

}
  #visitorContainer {
  position: fixed;
  top: 1266px;       /* من تحت */
  left: 50%;          /* في نص العرض */
  transform: translateX(-50%); /* يظبطه في النص بالظبط */
  
  background-color: rgba(0, 0, 0, 0.6);
  color: white;
  padding: 10px 20px;
  border-radius: 10px;
  font-size:40px;
  font-weight: bold;
  font-family: "Cairo", sans-serif;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}
</style>
</head>

<body>
<div id="visitorContainer">
  <span id="visitorCount"></span>
</div>
<div id="main">

  
<a href="home.html" class="logo-link">
  <div class="text-box">
    <div class="line1">طلبات الفحص المتنوع</div>
    <div class="line2">نيابة الشئون الاقتصادية وغسل الأموال</div>
    <div class="line3">بالإسكندرية</div>
  </div>
</a>
  
 <a href="https://ppo.gov.eg/ppo/r/ppoportal/ppoportal/econ-aml-prosecution" class="logo-link">
  <div class="text-box">
    <div class="line1">طلبات الرد</div>
    <div class="line2">نيابة الشئون الاقتصادية وغسل الأموال</div>
    <div class="line3">بمكتب النائب العام</div>
  </div>
</a>
</div>



  <script>

async function updateCounter() {
  try {
    const res = await fetch("/api/incrementCounter");
    const data = await res.json();
    document.getElementById("visitorCount").innerText =
      "عدد متلقى الخدمة " + data.COUNT;
  } catch (err) {
    console.error(err);
  }
}

// نحدث العداد لما الصفحة تفتح
updateCounter(); 
</script>
</body>
</html>
