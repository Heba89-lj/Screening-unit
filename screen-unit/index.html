    /* ***************************** */
     /* زر الشات */
.chat-float-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  display:flex;
  align-items:center;
  gap:10px;
  background:#0d6efd;
  color:white;
  padding:8px 14px;
  border-radius:50px;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(0,0,0,.3);
  z-index:1001;
  animation:pulse 2s infinite;
  transition:.3s ease;

}

.chat-float-btn:hover{
  transform:scale(1.05);
}

.chat-float-btn .icon{
  font-size:24px;
}

.chat-float-btn .label{
  font-size:12px;
  font-weight:500;
  white-space:nowrap;
    font-family: "cairo", sans-serif;

}

/* موبايل */
@media(max-width:600px){
  .chat-float-btn{
    padding:12px 20px;      /* عرض أكبر من الطول */
    border-radius:30px;    /* يخلي الجانبين دايرة */
  }
}

  .chat-float-btn .label{
font-size:20px;  }


@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(13,110,253,.5)}
  70%{box-shadow:0 0 0 15px rgba(13,110,253,0)}
  100%{box-shadow:0 0 0 0 rgba(13,110,253,0)}
}
    /* @keyframes pulse {

/* صندوق الشات */
.chat-container{
  font-family: "cairo", sans-serif;
  
  position:fixed;
  bottom:90px;
  right:20px;
  width:360px;
  height:420px;
  background:#fff;
  border-radius:16px;
  display:flex;
  flex-direction:column;
  box-shadow:0 10px 25px rgba(0,0,0,.2);
  opacity:0;
  pointer-events:none;
  transform:translateY(30px) scale(.95);
  transition:.7s cubic-bezier(.22, 1, .36, 1);
    z-index: 1000; /* ممكن نرفع الرقم */
color:black;
}

.chat-container.show{
  opacity:1;
  pointer-events:auto;
  transform:translateY(0) scale(1);
}

/* الهيدر */
.chat-header{
  font-family: "cairo", sans-serif;

  background:#0d6efd;
  color:#fff;
  padding:14px;
  text-align:center;
  border-radius:16px 16px 0 0;
}

/* الجسم */
.chat-body{
  flex:1;
  padding:15px;
  overflow-y:auto;
  background:#f7f9fc;
}

/* البابلز */
.message{
  font-family: "cairo", sans-serif;

  max-width:75%;
  padding:10px 14px;
  margin-bottom:10px;
  border-radius:16px;
  font-size:14px;
  line-height:1.5;
  animation:fadeIn .6s ease;
}

.user{
  background:#87CEEB;
  margin-left:auto;
  border-bottom-right-radius:4px;
  animation:slideRight .6s ease-out;

}

.bot{
  background:#e2e3e5;
  margin-right:auto;
  border-bottom-left-radius:4px;
  animation:slideLeft .6s ease-out;

}

.send-btn{
  width:48px;
  height:42px;
  border-radius:35%;
  background:#fff;
  color:#0d6efd;
  border:none;
  font-size:22px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.3s ease;
}

/* .send-btn:hover{
  background:#0b5ed7;
} */

.send-btn:active{
  transform:scale(.85);
}

@keyframes slideRight{
  from{opacity:0; transform:translateX(20px)}
  to{opacity:1; transform:translateX(0)}
}

@keyframes slideLeft{
  from{opacity:0; transform:translateX(-20px)}
  to{opacity:1; transform:translateX(0)}
}

@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}

/* كتابة البوت */
.typing{
  display:flex;
  gap:4px;
}
.typing span{
  width:6px;
  height:6px;
  background:#555;
  border-radius:50%;
  animation:blink 2.2s infinite both;
}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}

@keyframes blink{
  0%,80%,100%{opacity:.2}
  40%{opacity:1}
}

/* الفوتر */
.chat-footer{
  display:flex;
  border-top:1px solid #ddd;
}
.chat-footer input{
  flex:1;
  border:none;
  padding:14px;
  outline:none;
}
.chat-footer button{
  background:#0d6efd;
  color:#fff;
  border:none;
  padding:0 18px;
  cursor:pointer;
  transition:.3s ease;
}
.chat-footer button:active{
  transform:scale(.92);
}

/* موبايل */
@media(max-width:600px){
  .chat-container{
    width:95%;
    height:65%;
    right:50%;
    transform:translate(50%,30px);
  }
  .chat-container.show{
    transform:translate(50%,0);
  }
}
    /* ***************************** */

      /* Notifications */
.notif-wrapper {
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 20px;
  background:rgba(0,0,0,.2);
  direction:rtl;
}

.notif-icon {
  font-size:24px;
  cursor:pointer;
       position: relative; /* مهم */

}
.bell{
  display:inline-block; /* مهم جدًا */
  transform-origin: top center;
}
.notif-icon.active .bell{
animation: iconPulse 1.1s infinite;}

@keyframes iconPulse {
   0%   { transform: rotate(0); }
  10%  { transform: rotate(20deg); }
  20%  { transform: rotate(-20deg); }
  30%  { transform: rotate(15deg); }
  40%  { transform: rotate(-15deg); }
  50%  { transform: rotate(10deg); }
  60%  { transform: rotate(-10deg); }
  70%  { transform: rotate(5deg); }
  100% { transform: rotate(0); }
}

.notif-badge{
  position:absolute;
  top:-6px;
  right:-6px;
  background:red;
  color:white;
  font-size:12px;
  min-width:18px;
  height:18px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  padding:0 4px;
  box-shadow:0 0 6px rgba(0,0,0,.4);
}

/* إخفاء الرقم لو صفر */
.notif-badge.hide{
  display:none;
}

.notif-bar {
  overflow:hidden;
  white-space:nowrap;
  flex:1;
  border-radius:8px;
  /* background:#0d6efd; */
  width:0;
  padding:0;
  transition: width .4s ease, padding .4s ease;
}

.notif-bar.show {
  width:70%;
  padding:8px 12px;
}

.notif-track {
  display:inline-block;
  white-space:nowrap;
  animation:scrollNotif linear infinite;
}


.notif-text {
  color:white;
  font-size:25px;
  white-space:nowrap;
}

.notif-bar:hover .notif-track {
  animation-play-state:paused;
}

@keyframes scrollNotif {
  0%   { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}
  </style>
</head>

       <div class="chat-float-btn" id="toggleChat">

<div class="chat-container" id="chatBox">

  <div class="chat-body" id="chatBody">
    <div class="message bot">👋 السلام عليكم ورحمة الله وبركاته
مع حضرتك المساعد الذكي للفحص المتنوع

  <script>
    // ✅ تحميل الهيدر الخارجى
    fetch('header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header').innerHTML = data;
      })
      .catch(error => console.error('خطأ في تحميل الهيدر:', error));

    // ✅ تحديث الـ service worker (لو موجود)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let registration of registrations) {
          registration.unregister();
        }
      }).then(() => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(() => console.log('✅ Service Worker Registered من جديد'))
          .catch(err => console.error('❌ فشل التسجيل:', err));
      });
    }
    // **********************
    const toggleChat=document.getElementById("toggleChat");
const chatBox=document.getElementById("chatBox");
const chatBody=document.getElementById("chatBody");
const chatInput=document.getElementById("chatInput");

toggleChat.onclick = () => {
  const isOpen = chatBox.classList.toggle("show");

  if (isOpen) {
    // عند الفتح: تنظيف الشات وإضافة التحية
    chatBody.innerHTML = "";
    addMessage("👋 السلام عليكم ورحمة الله وبركاته\nمع حضرتك المساعد الذكي للفحص المتنوع\nأخبار حضرتك يارب تكون بخير\nأنا موجود هنا لمساعدتك اتفضل.", "bot");
  } else {
    // إضافة رسالة الختام
    const closingMsg = "👋 شكراً لاستخدامك المساعد الذكي، إلى اللقاء!";
    addMessage(closingMsg, "bot");

    // تمرير الشات لأسفل تلقائيًا لضمان ظهور الرسالة
    chatBody.scrollTop = chatBody.scrollHeight;

    // نترك الرسالة على الشاشة 10 ثواني قبل الإغلاق
    setTimeout(() => {
      // عمل FadeOut للشات
      chatBox.style.transition = "opacity 1s ease";
      chatBox.style.opacity = "0";

      // بعد انتهاء الـ FadeOut نغلق الشات ونعيد الإعدادات
      setTimeout(() => {
        chatBox.classList.remove("show");
        chatBox.style.opacity = ""; // لإعادة الوضع الطبيعي عند الفتح القادم
      }, 1000);
    }, 10000); // مدة عرض رسالة الختام: 10 ثواني
  }
};



function addMessage(text,type){
  const div=document.createElement("div");
  div.className=`message ${type}`;
  div.innerText=text;
  chatBody.appendChild(div);
  chatBody.scrollTop=chatBody.scrollHeight;
}

function typingBubble(){
  const div=document.createElement("div");
  div.className="message bot";
  div.innerHTML=`<div class="typing">
    <span></span><span></span><span></span>
  </div>`;
  chatBody.appendChild(div);
  chatBody.scrollTop=chatBody.scrollHeight;
  return div;
}

async function sendMessage(){
  const text=chatInput.value.trim();
  if(!text) return;

  addMessage(text,"user");
  chatInput.value="";

  const typing=typingBubble();

  try{
    const res=await fetch("/api/assistant",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:text})
    });
    const data=await res.json();
    typing.innerText=data.answer||"لا توجد إجابة حالياً";
  }catch{
    typing.innerText="❌ حدث خطأ في الاتصال";
  }
}

chatInput.addEventListener("keydown",e=>{
  if(e.key==="Enter") sendMessage();
});
    // *******************

    /* ===================== Notifications Code ===================== */


 const notifBtn = document.getElementById("notifBtn");
    const notifBar = document.getElementById("notifBar");
    const notifTrack = document.getElementById("notifTrack");
    const notifCount = document.getElementById("notifCount");

   async function loadNotifications(){
  try{
    const res = await fetch("/api/notifications");
    const data = await res.json();

    const messages = (data.messages && data.messages.length)
      ? data.messages
      : ["لا توجد إشعارات حالياً"];

    notifTrack.innerHTML = `<span class="notif-text">${messages.join(" 🔹 ")}</span>`;

    // 🔔 عداد الجرس
    if(data.messages && data.messages.length>0){
      notifCount.innerText = data.messages.length;
      notifCount.classList.remove("hide");
    }else{
      notifCount.classList.add("hide");
    }

    // ✅ تثبيت سرعة الحركة
    setTimeout(() => {
      const notifText = notifTrack.querySelector(".notif-text");

      const textWidth = notifText.offsetWidth;
      const containerWidth = notifBar.offsetWidth;

      const totalDistance = textWidth + containerWidth;

      const duration = totalDistance / 70;

      notifTrack.style.animationDuration = duration + "s";
    }, 100);

  }catch{
    notifTrack.innerHTML = `<span class="notif-text">❌ فشل تحميل الإشعارات</span>`;
    notifCount.classList.add("hide");
  }
}
// ✅ لازم ده
loadNotifications();

  </script>
