





 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>الاستفسار عن الفحص</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lateef:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      margin: 0;
      padding: 0 0 80px 0;
      font-family: "Lateef", "Cairo", sans-serif;
      background: linear-gradient(to bottom right, #0a1f44, #1e3c72, #2a5298);
      color: #fff;
      text-align: center;
      position: relative;
      min-height: 100vh;
    }

    #main-content { padding: 20px; }
    h1 { color: black; margin-bottom: 20px; }
    input, datalist, select { padding: 10px; margin: 5px; width: 90%; max-width: 300px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
    button { background-color: #5b6a7a; color: white; border: none; padding: 10px 5px; border-radius: 8px; cursor: pointer; font-size: 16px; }
    button:hover { background-color: #80b0e4; }
    table { width: 95%; max-width: 800px; margin: 20px auto; border-collapse: collapse; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-radius: 10px; overflow: hidden; table-layout: fixed; }
    th { background-color: #789ec7; color: white; text-align: right; padding: 10px; width: 35%; }
    td { padding: 10px; text-align: right; word-break: break-word; overflow-wrap: anywhere; white-space: normal; vertical-align: top; color: black; }
    .prewrap { white-space: pre-wrap; word-break: break-word; }
    @media (max-width: 600px) { table { font-size: 14px; } input, button, select { width: 60%; font-size: 14px; } }

   
    #notesModal { 
  display:none; 
  position:fixed; 
  top:0; 
  left:0; 
  width:100%; 
  height:100%; 
  background:rgba(0,0,0,0.5); 
  justify-content:center; 
  align-items:center; 
}

#notesModalContent { 
  background:white; 
  color:black; 
  padding:20px; 
  border-radius:10px; 
  max-width:400px; 
  width:90%; 
  position:relative; 
  max-height:80vh;      /* أقصى ارتفاع */
  overflow-y:auto;      /* سكرول رأسي */
  overflow-x:auto;      /* سكرول أفقي لو الجدول عريض */
}

#closeModal { 
  position:absolute; 
  top:10px; 
  right:15px; 
  cursor:pointer; 
  font-size:20px; 
} 


  </style>
</head>

<body>
  <div id="header"></div>

  <div id="main-content">
    <h1>الاستفسار عن الفحص</h1>

    <input id="number" placeholder="رقم الفحص" list="previousNumbers">
    <datalist id="previousNumbers"></datalist>

    <input id="year" placeholder="السنة" list="previousYears">
    <datalist id="previousYears"></datalist>

    <select id="idType">
      <option value="national">الرقم القومي</option>
      <option value="passport">جواز السفر</option>
    </select>

    <input id="nationalId" placeholder="الرقم القومي" maxlength="14" list="previousNationalIds">
    <datalist id="previousNationalIds"></datalist>

    <button id="searchBtn">بحث</button>

      </div>

    
    
    <div id="result" style="margin-top:20px; font-weight:bold; "></div>
        <div id="printTime" style="margin-top:10px; color:white;"></div>

  </div>

  <button id="notesBtn" style="display:none;">المديونية</button>

  <div id="notesModal">
    <div id="notesModalContent">
      <span id="closeModal">&times;</span>
      <h3>بيان بالمديونية الواردة على مقدم طلب الفحص</h3>
      <table id="modalTable" style="width:100%; margin-top:10px; border-collapse:collapse;"></table>
    </div>
  </div>

  <script>
    fetch("header.html").then(res => res.text()).then(html => document.getElementById("header").innerHTML = html);

    function normalize(str="") { return str.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).trim(); }
    function escapeHtml(str) { return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"); }

    const storedNumbers = JSON.parse(localStorage.getItem("searchNumbers") || "[]");
    const storedYears = JSON.parse(localStorage.getItem("searchYears") || "[]");
    const storedNationalIds = JSON.parse(localStorage.getItem("searchNationalIds") || "[]");

    function updateDatalist(id,data){ document.getElementById(id).innerHTML = data.map(v=>`<option value="${v}"></option>`).join(""); }
    updateDatalist("previousNumbers", storedNumbers);
    updateDatalist("previousYears", storedYears);
    updateDatalist("previousNationalIds", storedNationalIds);

    function saveValue(array,key,value){
      if(value && !array.includes(value)){
        array.unshift(value);
        if(array.length>10) array.pop();
        localStorage.setItem(key, JSON.stringify(array));
      }
    }

    const idTypeSelect = document.getElementById("idType");
    const nationalIdInput = document.getElementById("nationalId");

    idTypeSelect.addEventListener("change", () => {
      const type = idTypeSelect.value;
      nationalIdInput.value = "";

      if(type === "national") {
        nationalIdInput.placeholder = "أدخل الرقم القومي (14 رقم)";
        nationalIdInput.maxLength = 14;
      } else {
        nationalIdInput.placeholder = "أدخل رقم جواز السفر (10 خانات)";
        nationalIdInput.maxLength = 10;
      }
    });

    nationalIdInput.addEventListener("input", () => {
      nationalIdInput.value = nationalIdInput.value.replace(/[٠-٩]/g, d => "0123456789"[ "٠١٢٣٤٥٦٧٨٩".indexOf(d) ]);
    });

    idTypeSelect.dispatchEvent(new Event("change"));

    async function search(number, year, nationalId){
      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = "جارٍ البحث...";
      try{
        const res = await fetch(`/api/search?number=${encodeURIComponent(number)}&year=${encodeURIComponent(year)}&nationalId=${encodeURIComponent(nationalId)}`);
        const data = await res.json();
        if(data.success){
          const r = data.result;


        const now = new Date();

const date = now.toLocaleDateString("ar-EG", {
  weekday: "long",
  year: "numeric",
  month: "long",
  day: "numeric"
});

const time = now.toLocaleTimeString("ar-EG", {
  hour: "2-digit",
  minute: "2-digit"
});
          resultDiv.innerHTML = `
            <div style="color:white; font-size:18px;">
    تم الاستعلام يوم ${date} الساعة ${time}
  </div>
            <table>
              <tr>
   <th>رقم الفحص</th>
 <td>
  ${escapeHtml(r.number || "-")}

</td>
</tr>


              <tr><th>السنة</th><td>${escapeHtml(r.year || "-")}</td></tr>
              <tr><th>رقم القضية</th><td>${escapeHtml(r.caseNumber || "-")}</td></tr>
              <tr><th>اسم مقدم الطلب</th><td>${escapeHtml(r.applicant || "-")}</td></tr>
             
              <tr>
  <th>حالة الفحص</th>
  <td>
    ${escapeHtml(r.status || "-")}
    ${
      r.status && r.status.includes("أرسلت القضية لنيابة الشئون الإقتصادية وغسل الأموال بمكتب النائب العام")
        ? ` <a href="https://maps.app.goo.gl/umUJwWYGYgfTV4aP8?g_st=aw" target="_blank" style="margin-right:10px;">📍 العنوان</a>`
        : ""
    }
  </td>
</tr>
              <tr><th>ما تم في الفحص</th><td class="prewrap">${escapeHtml(r.visa || "-").replace(/\r?\n/g,"<br>")}</td></tr>
              <tr><th>ملاحظات</th><td class="prewrap">${escapeHtml(r.notes || "-").replace(/\r?\n/g,"<br>")}</td></tr>
            ${r.replyRequestNumber ? `
<tr>
  <th>رقم طلب الرد بمكتب النائب العام</th>
  <td>${escapeHtml(r.replyRequestNumber)}</td>
</tr>
` : ""}
            </table>`;
   

        const notesBtn = document.getElementById("notesBtn");

        if(r.hasNotes && r.hasNotes.toString().toLowerCase().includes("مميكن")){
          notesBtn.textContent = "نموذج مميكن";
          notesBtn.style.display = "inline-block";

         notesBtn.onclick = () => {
const url = `momikn.html?selfName=${encodeURIComponent(r.applicant)}
&caseNumber=${encodeURIComponent(r.caseNumber)}
&number=${encodeURIComponent(r.number)}
&mix=${encodeURIComponent(r.mix)}

&nationalId=${encodeURIComponent(r.nationalId || "")}`;

window.location.href = url;}

        } else if(r.hasNotes && r.hasNotes.toString().toLowerCase().includes("ملاحظات")){
          notesBtn.textContent = "المديونية";
          notesBtn.style.display = "inline-block";

          notesBtn.onclick = () => {
            const modalTable = document.getElementById("modalTable");
            modalTable.innerHTML = "";

            if(r.publicProsecution) modalTable.innerHTML += `<tr><th>مطالبات نائب عام</th><td>${escapeHtml(r.publicProsecution)}</td></tr>`;
            if(r.justiceRequests) modalTable.innerHTML += `<tr><th>مطالبات وزارة العدل</th><td>${escapeHtml(r.justiceRequests)}</td></tr>`;
            if(r.taxes) modalTable.innerHTML += `<tr><th>الضرائب</th><td>${escapeHtml(r.taxes)}</td></tr>`;
            if(r.courtExecution) modalTable.innerHTML += `<tr><th>تنفيذ الأحكام</th><td>${escapeHtml(r.courtExecution)}</td></tr>`;

            document.getElementById("notesModal").style.display = "flex";
          }

        } else {
          notesBtn.style.display = "none";
        }
        } else {
          resultDiv.textContent = data.message || "لم يتم العثور على بيانات لهذا الفحص.";
          document.getElementById("notesBtn").style.display = "none";
        }

        saveValue(storedNumbers,"searchNumbers",number);
        saveValue(storedYears,"searchYears",year);
        saveValue(storedNationalIds,"searchNationalIds",nationalId);

        updateDatalist("previousNumbers", storedNumbers);
        updateDatalist("previousYears", storedYears);
        updateDatalist("previousNationalIds", storedNationalIds);

      } catch(err){
        console.error(err);
        resultDiv.textContent = "حدث خطأ في الاتصال بالسيرفر.";
        document.getElementById("notesBtn").style.display = "none";
      }
    }

    document.getElementById("searchBtn").addEventListener("click", ()=>{
      const number = normalize(document.getElementById("number").value.trim());
      const year = normalize(document.getElementById("year").value.trim());
      const nationalId = normalize(document.getElementById("nationalId").value.trim());
      const type = document.getElementById("idType").value;

      if(!number || !year || !nationalId){
        document.getElementById("result").textContent = "من فضلك أدخل رقم الفحص والسنة والرقم القومي/جواز السفر.";
        return;
      }

      if(type === "national" && nationalId.length !== 14){
        document.getElementById("result").textContent = "يجب أن يتكون الرقم القومي من 14 رقمًا بالضبط.";
        return;
      }

      if(type === "passport" && nationalId.length > 10){
        document.getElementById("result").textContent = "رقم جواز السفر يجب ألا يزيد عن 10 خانات.";
        return;
      }

      search(number, year, nationalId);
    });

    // إغلاق الـ Modal
    document.getElementById("closeModal").onclick = () => document.getElementById("notesModal").style.display = "none";
    document.getElementById("notesModal").onclick = (e) => { if(e.target.id === "notesModal") e.target.style.display = "none"; }


  </script>


 
</body>
</html>
